name: Validate Status security metadata branch

on:
  push:
    branches: [feat/security-txt]
    paths:
      - ".github/workflows/phase3-validate-security-txt.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-validate-security-txt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: feat/security-txt
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
      - name: Validate Status source and contracts
        run: |
          set -euo pipefail
          npx --yes html-validate@9.7.1 index.html
          node --test test/*.test.mjs
          python3 scripts/normalize_page_title.py --check
          python3 scripts/verify_interface_bundle.py
          git diff --check
      - name: Commit validation marker
        run: |
          set -euo pipefail
          printf '%s\n' '{"schema_version":"atlas-systems/security-txt-validation/v1","surface":"status","result":"pass"}' > .phase3-security-txt-validation.json
          git add .phase3-security-txt-validation.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: record Status security metadata validation"
          git push origin HEAD:feat/security-txt
