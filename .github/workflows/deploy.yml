name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: AtlasReaper311/atlas-infra/.github/workflows/validate-static.yml@9e09c7f195fab8b1a695818a3350847328dede0c # atlas-infra Pages artifact boundary (wrangler 4.116.0)
    with:
      project_name: status
      site_label: status.atlas-systems.uk
      inject_build_meta: false
    secrets: inherit
