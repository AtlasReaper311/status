name: Prepare Status social preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/phase2-status-social-preview.yml"
      - "index.html"
      - "test/interface-shell.test.mjs"
      - ".github/workflows/deploy.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-phase2-status-social-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/status-social-preview-and-deploy-pin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Prove central satellite cards are live
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/atlas-social-cards"
          for card in ramone status api-docs cv
          do
            curl --fail --location --retry 6 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "https://atlas-systems.uk/og/${card}.png" \
              --output "${RUNNER_TEMP}/atlas-social-cards/${card}.png"
          done
          CARD_ROOT="${RUNNER_TEMP}/atlas-social-cards" python3 - <<'PY'
          import os
          import struct
          from pathlib import Path

          root = Path(os.environ["CARD_ROOT"])
          for path in sorted(root.glob("*.png")):
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"not a PNG: {path.name}")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != (1200, 630):
                  raise SystemExit(f"wrong dimensions for {path.name}: {width}x{height}")
              if len(data) < 10_000:
                  raise SystemExit(f"unexpectedly small image: {path.name}")
              print(f"verified {path.name}: {width}x{height}, {len(data)} bytes")
          PY

      - name: Materialize Status metadata and current deploy authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          old_card = "https://atlas-systems.uk/og-default.png"
          new_card = "https://atlas-systems.uk/og/status.png"
          if html.count(old_card) != 2:
              raise SystemExit("expected exactly two generic Status card references")
          html = html.replace(old_card, new_card)
          old_alt = '<meta property="og:image:alt" content="Atlas Systems public status and reliability interface">'
          new_alt = '<meta property="og:image:alt" content="Live estate status. // Atlas Systems">'
          if html.count(old_alt) != 1:
              raise SystemExit("expected the existing Status Open Graph alt tag")
          html = html.replace(old_alt, new_alt)
          twitter_image = f'<meta name="twitter:image" content="{new_card}">'
          twitter_alt = '<meta name="twitter:image:alt" content="Live estate status. // Atlas Systems">'
          if twitter_alt not in html:
              if html.count(twitter_image) != 1:
                  raise SystemExit("expected one Status Twitter image tag")
              html = html.replace(twitter_image, f"{twitter_image}\n{twitter_alt}")
          index.write_text(html, encoding="utf-8")

          test = Path("test/interface-shell.test.mjs")
          source = test.read_text(encoding="utf-8")
          anchor = '  assert.doesNotMatch(html, /fonts\\.(?:googleapis|gstatic)\\.com/);\n'
          addition = '''  assert.match(html, /property="og:image" content="https:\\/\\/atlas-systems\\.uk\\/og\\/status\\.png"/);\n  assert.match(html, /name="twitter:image" content="https:\\/\\/atlas-systems\\.uk\\/og\\/status\\.png"/);\n  assert.match(html, /property="og:image:alt" content="Live estate status\\. \\/\\/ Atlas Systems"/);\n  assert.match(html, /name="twitter:image:alt" content="Live estate status\\. \\/\\/ Atlas Systems"/);\n'''
          if addition not in source:
              if source.count(anchor) != 1:
                  raise SystemExit("could not locate Status metadata test anchor")
              source = source.replace(anchor, anchor + addition)
          test.write_text(source, encoding="utf-8")

          deploy = Path(".github/workflows/deploy.yml")
          workflow = deploy.read_text(encoding="utf-8")
          old = "AtlasReaper311/atlas-infra/.github/workflows/validate-static.yml@093df3f87fa4e068155455f82c9b69bffad76fb6 # atlas-infra main"
          new = "AtlasReaper311/atlas-infra/.github/workflows/validate-static.yml@a9a183bc055ec5e4c878e2d5aab8cf4a38ac9656 # atlas-infra Pages artifact boundary"
          if old not in workflow and new not in workflow:
              raise SystemExit("unexpected Status deploy authority pin")
          deploy.write_text(workflow.replace(old, new), encoding="utf-8")
          PY

      - name: Validate generated source
        run: |
          set -euo pipefail
          npx --yes html-validate@9.7.1 index.html
          node --test test/*.test.mjs
          python3 scripts/normalize_page_title.py --check
          python3 scripts/verify_interface_bundle.py
          git diff --check

      - name: Commit exact generated changes
        run: |
          set -euo pipefail
          git add index.html test/interface-shell.test.mjs .github/workflows/deploy.yml
          if git diff --cached --quiet
          then
            echo "Status source is already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: use the Status social preview card"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
